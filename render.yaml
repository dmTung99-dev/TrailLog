# Staging environment on Render (free plan). Database is Neon, photos are
# Cloudflare R2 — both configured through the env vars below.
# Setup steps: see "Staging" in README.md.
services:
  - type: web
    name: traillog-api-staging
    runtime: docker
    plan: free
    region: singapore
    branch: master
    # Only changes under backend/ trigger a build; mobile-only commits don't.
    rootDir: backend
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    # Deploy only after the linked branch's GitHub Actions checks pass.
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        value: traillog-staging
      # Secrets: Render asks for these once, when the Blueprint is created.
      - key: DATABASE_URL
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
